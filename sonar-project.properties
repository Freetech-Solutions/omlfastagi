# Unique identifier of the project in SonarQube
sonar.projectKey=omnileads-fastagi

# Name of the project
sonar.projectName=OMniLeads FastAGI

# Path to the source directories
sonar.sources=.

# Exclude build artifacts and dependencies from source analysis
sonar.exclusions=**/__pycache__/**, **/.pytest_cache/**, **/venv/**, **/.venv/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8
